
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste sua Magia - Candy Roulette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background: radial-gradient(circle at center, #0a2f23 0%, #040d0b 100%);
            color: #f3e5ab;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .parchment {
            background-color: #f2e8c9;
            background-image: url("https://www.transparenttextures.com/patterns/parchment.png");
            color: #433422;
        }
        .magical-glow {
            text-shadow: 0 0 10px rgba(243, 229, 171, 0.5), 0 0 20px rgba(243, 229, 171, 0.3);
        }
        @keyframes drift {
            from { transform: translateY(0px) rotate(0deg); }
            to { transform: translateY(-20px) rotate(5deg); }
        }
        .floating {
            animation: drift 4s infinite alternate ease-in-out;
        }
        .wand-pointer {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
        }
    </style>
